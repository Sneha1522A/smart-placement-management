<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Smart Placement Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                SPMS
            </div>

            <h1>Student Login</h1>

            <p class="subtitle">
                Smart Placement Management System
            </p>

            <form id="loginForm">

                <!-- Student Email -->
                <div class="form-group">

                    <label for="email">
                        Student Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >

                    <small id="emailError"></small>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                    >

                    <small id="passwordError"></small>

                    <p class="password-hint">
                        Password must contain at least 8 characters,
                        one capital letter, one number, and one special character.
                    </p>

                </div>


                <!-- Forgot Password -->
                <div class="forgot-password">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-btn">
                    Login
                </button>


                <!-- Login Message -->
                <p id="loginMessage"></p>

            </form>


            <!-- Register -->
            <p class="register-text">

                Don't have an account?

                <a href="#">
                    Register
                </a>

            </p>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/login.js"></script>

</body>

</html>
